version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Network / HTTP
  dio: ^5.4.3+1
  
  # Image Picker
  image_picker: ^1.1.2
  
  # UI & Markdown
  flutter_markdown: ^0.7.2
  cupertino_icons: ^1.0.6

  # Week 3 & 4 additions
  shared_preferences: ^2.2.3
